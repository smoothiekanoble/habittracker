name: Garmin Sleep Sync

on:
  workflow_dispatch:
    inputs:
      date:
        description: "End date to sync in YYYY-MM-DD. Defaults to today in UTC."
        required: false
        type: string
      days:
        description: "Number of days to fetch, ending at date."
        required: false
        default: "1"
        type: string
      upsert:
        description: "Set true to upsert to Supabase. Default is dry-run."
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      save_raw:
        description: "Save raw JSON as a workflow artifact for debugging. Avoid for personal data unless necessary."
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  # schedule:
  #   - cron: "17 11 * * *"

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
      GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      HABITTRACKER_USER_ID: ${{ secrets.HABITTRACKER_USER_ID }}
      GARMINTOKENS: local-data/garmin/tokens
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade garminconnect curl_cffi

      - name: Run normalization tests
        run: python scripts/garmin/test_sync_garmin_sleep.py

      - name: Sync Garmin sleep
        shell: bash
        run: |
          set -euo pipefail
          args=(--days "${{ inputs.days || '1' }}")
          if [ -n "${{ inputs.date }}" ]; then
            args+=(--date "${{ inputs.date }}")
          fi
          if [ "${{ inputs.save_raw }}" = "true" ]; then
            args+=(--save-raw)
          fi
          if [ "${{ inputs.upsert }}" = "true" ]; then
            args+=(--upsert)
          else
            args+=(--dry-run)
          fi
          python scripts/garmin/sync_garmin_sleep.py "${args[@]}"
